<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10172D" />
      <stop offset="45%" stop-color="#212038" />
      <stop offset="100%" stop-color="#543026" />
    </linearGradient>
    <linearGradient id="glow4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2D6" />
      <stop offset="60%" stop-color="#F5C86A" />
      <stop offset="100%" stop-color="#EBA75E" />
    </linearGradient>
  </defs>

  <rect width="600" height="750" fill="url(#bg4)" rx="24" />

  <!-- Cozy family home & warm hearth glow -->
  <g transform="translate(300, 275)">
    <!-- Warm radiant circle -->
    <circle cx="0" cy="0" r="115" fill="#252744" stroke="#F5C86A" stroke-width="2" opacity="0.8" />
    <circle cx="0" cy="0" r="80" fill="url(#glow4)" opacity="0.2" />

    <!-- Cozy house / home silhouette with warm glowing window -->
    <path d="M0,-65 L-55,-15 L-55,55 L55,55 L55,-15 Z" fill="#171D35" stroke="#F5C86A" stroke-width="2.5" />
    <!-- Roof overhang -->
    <path d="M-68,-10 L0,-70 L68,-10" fill="none" stroke="#F5C86A" stroke-width="4" stroke-linecap="round" />
    <!-- Heart in center of home -->
    <path d="M0,15 C-18,-5 -22,-22 -9,-30 C-1,-34 0,-22 0,-22 C0,-22 1,-34 9,-30 C22,-22 18,-5 0,15 Z" 
          fill="url(#glow4)" />
    <!-- Chimney smoke spirals -->
    <path d="M30,-45 C35,-60 25,-75 35,-90" fill="none" stroke="#C8A8FF" stroke-width="2" stroke-dasharray="3 3" opacity="0.8" />
  </g>

  <!-- Bottom card -->
  <rect x="60" y="520" width="480" height="150" rx="16" fill="#10172D" opacity="0.85" stroke="#F5C86A" stroke-width="1.5" stroke-opacity="0.3" />
  <text x="300" y="575" fill="#F5C86A" font-family="'Cormorant Garamond', Georgia, serif" font-size="28" font-weight="600" text-anchor="middle" letter-spacing="1">
    FAMILY MOMENTS
  </text>
  <text x="300" y="615" fill="#FAF0E1" font-family="'Inter', sans-serif" font-size="15" text-anchor="middle" opacity="0.85">
    “The warmth, celebrations, and togetherness of home”
  </text>
  <text x="300" y="645" fill="#C8A8FF" font-family="'Caveat', cursive" font-size="18" text-anchor="middle">
    Drop a family memory photo here (memory-4.jpg)
  </text>
</svg>
