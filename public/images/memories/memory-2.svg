<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#171D35" />
      <stop offset="50%" stop-color="#252744" />
      <stop offset="100%" stop-color="#3B2338" />
    </linearGradient>
    <linearGradient id="funGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF4DE" />
      <stop offset="60%" stop-color="#F5C86A" />
      <stop offset="100%" stop-color="#EBA75E" />
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="750" fill="url(#bg2)" rx="24" />

  <!-- Playful laughter icons & smiles -->
  <g transform="translate(300, 280)">
    <!-- Central Laughing / Joy Icon -->
    <circle cx="0" cy="0" r="105" fill="#252744" stroke="#F5C86A" stroke-width="2.5" opacity="0.9" />
    <circle cx="0" cy="0" r="95" fill="none" stroke="#C8A8FF" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.6" />
    
    <!-- Big joyful smile -->
    <path d="M-45,-15 Q-30,-35 -15,-15" fill="none" stroke="#F5C86A" stroke-width="5" stroke-linecap="round" />
    <path d="M15,-15 Q30,-35 45,-15" fill="none" stroke="#F5C86A" stroke-width="5" stroke-linecap="round" />
    <path d="M-48,15 Q0,75 48,15" fill="none" stroke="#FFF4DE" stroke-width="5.5" stroke-linecap="round" />
    <path d="M-35,32 Q0,65 35,32" fill="#EBA75E" opacity="0.3" />

    <!-- Sparkles & laugh bubbles -->
    <circle cx="-130" cy="-60" r="14" fill="#C8A8FF" opacity="0.4" filter="url(#glow2)" />
    <circle cx="120" cy="-70" r="10" fill="#F5C86A" opacity="0.5" filter="url(#glow2)" />
    <circle cx="140" cy="60" r="18" fill="#FFF4DE" opacity="0.3" filter="url(#glow2)" />
    <path d="M-90,90 L-87,97 L-80,100 L-87,103 L-90,110 L-93,103 L-100,100 L-93,97 Z" fill="#F5C86A" />
  </g>

  <!-- Bottom card -->
  <rect x="60" y="520" width="480" height="150" rx="16" fill="#10172D" opacity="0.85" stroke="#F5C86A" stroke-width="1.5" stroke-opacity="0.3" />
  <text x="300" y="575" fill="#F5C86A" font-family="'Cormorant Garamond', Georgia, serif" font-size="28" font-weight="600" text-anchor="middle" letter-spacing="1">
    OUR FUNNIEST MOMENT
  </text>
  <text x="300" y="615" fill="#FAF0E1" font-family="'Inter', sans-serif" font-size="15" text-anchor="middle" opacity="0.85">
    “Inside jokes, silly fights, and endless banter”
  </text>
  <text x="300" y="645" fill="#C8A8FF" font-family="'Caveat', cursive" font-size="18" text-anchor="middle">
    Drop your funny memory photo here (memory-2.jpg)
  </text>
</svg>
